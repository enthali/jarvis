    name: "Bug: error assigning Agent Modes — our undocumented-VS Code-API patch may be breaking"
    status: Backlog
    priority: High
    labels: ["P1", "bug"]
    notes: "2026-08-21, user-reported and reproduced. Likely fallout from agent-mode-persistence (GH #25, shipped v0.14.0-era 2026-07-14): re-applies mode via VS Code's undocumented workbench.action.chat.open<ModeName> command, working around microsoft/vscode#317276. Repro (2026-08-21): Dev Engineer creates a new session via sendMessage — open/rename/prompt-assign/initial mode-set all succeed — but the mode-set command then fires again and lands in Project Manager (the last-active session) instead. Possible timing issue (focus already switched back before the command runs) or the create-session sequence isn't awaited/ordered correctly. Not yet root-caused."
