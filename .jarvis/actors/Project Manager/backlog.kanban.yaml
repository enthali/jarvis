    notes: "2026-08-24, user-reported. A newly created file doesn't show up in Recently Touched Files, only edits to existing ones do. Small fix."
  - id: 10
    name: "Bug: gitignore 'jarvis-*' managed entry is unanchored, matches any file/dir by name anywhere in tree"
    status: Backlog
    priority: Medium
    labels: ["bug"]
    notes: "Found 2026-08-24 while committing docs/changes/jarvis-kanban-skill.md — git check-ignore confirmed .gitignore:31 jarvis-* swallowed it. Pattern meant for root-level VSIX build artifacts (e.g. jarvis-core-x.y.z.vsix) but the WORKSPACE_PATHS entry (configPaths.ts) has no leading slash, so it matches at any depth by filename. Fix: anchor to /jarvis-*.vsix or similar."

