  - id: 42
    name: Actor identity via agent mode - replaces jarvis_whoAmI
    status: In Progress
    labels:
      - architecture
      - identity
      - agent-mode
      - hooks
    notes: 'Follow-up idea discussed and refined with the user, relayed by System
      Designer (2026-09-27); explicitly not part of retire-legacy-actor-kinds.
      Goal: an Actor resolves its identity reliably without hooks, including
      after /compact. Agreed concept: each Actor has a mandatory binding to its
      own .github/agents/<actorname>.agent.md. Immediately after YAML front
      matter, Jarvis maintains a managed section beginning with the exact lines
      "You act as Actor <name>" and "Your context memory is <workspace-relative
      path to context.md>"; the rest remains user-owned (e.g. optional tools
      restriction; absent tools: means default tools). actor.yaml may point to a
      persona file (e.g. a syspilot agent); as agent files cannot include other
      files, Jarvis copies persona content into the managed section, ideally
      before each message send, so upstream persona updates propagate. Remove
      jarvis_whoAmI, require ownerName on Kanban tools, and remove the obsolete
