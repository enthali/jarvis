      touched-files-created-files, closed not-reproducible). The allowlist
      itself is fine (deliberate, per REQ_ENT_TOUCHEDFILES AC-2d — no
      path-sniffing fallback); the defect is that the system can't report when
      the list is stale for a given model/VS Code version. Recommended: log
      unmatched tool_names at debug, deduplicated per session, before extending
      the allowlist — observability first, then extend from evidence not
      guesses. UPDATE 2026-08-26: user observed live in syspilot's Project
      Manager session — a doc-creation step showed 'Generating patch ...' in the
      UI instead of the known
      create_file/replace_string_in_file/multi_replace_string_in_file flow.
      CONFIRMED same day: the PM session self-reported it used `apply_patch` to
      create docs/changes/documentation-truth-review.md directly (bypassing the
      canonical generate-path/contract-creation function too — a separate
      process gap). `apply_patch` is now a confirmed, named tool_name missing
      from touchTracker.ts's TOUCH_RULES allowlist, not just a theoretical gap.
      Not working this further right now per user (2026-08-26) — captured for
      when this is picked up."
