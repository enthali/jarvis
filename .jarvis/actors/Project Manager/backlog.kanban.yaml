  - id: 42
    name: Actor identity via agent mode - replaces jarvis_whoAmI
    status: Backlog
    labels:
      - architecture
      - identity
      - agent-mode
      - hooks
    notes: 'Concept settled with the user 2026-10-03 (replaces the earlier draft
      that copied persona content). GOAL: an Actor knows its identity reliably
      without hooks, including after /compact. SETTLED: (1) The link is the
      Actor name. The `agent` field is removed from actor.yaml. Jarvis finds the
      Actor''s agent by its front matter `name:` equal to the Actor name, not by
      file name: Syspilot''s files up to 0.9 are called syspilot.<role>.agent.md
      but already carry name = Actor name, so they are found as they are. If no
      agent has that name, Jarvis creates <actor name>.agent.md with front
      matter `name: "<actor name>"`. Actor names are unique (enforced), so two
      Actors can never share an agent. (2) Jarvis maintains exactly two lines
      right after the YAML front matter: line 1 "You act as Actor <name>", line
      2 "Your context memory is <workspace-relative path to context.md>".
