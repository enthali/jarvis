  - id: 15
    name: "jarvis_updateKanbanFields: add renameField/renameOption (bulk rename) — atomic rename of a field/option definition plus migration of all referencing items in one write"
    status: Backlog
    priority: Low
    notes: "F-2 from kanban-management-tools (2026-08-26). Today removeField/removeOption refuse to remove anything still referenced by an item, so renaming requires hand-editing every referencing item first, then remove+add. User accepted the manual workaround for now; this is the follow-up idea to make rename atomic and safe."
  - id: 16
    name: "Kanban skill: document archiving pattern — move Done items to a separate archive board file once a board grows large"
    status: Backlog
    priority: Low
    notes: "Raised 2026-08-26: user has a real customer-project board at ~2k lines (not reachable from this workspace, different machine/OS). Discussed one-file-per-board vs one-file-per-item; decided against splitting storage (breaks atomic multi-item writes needed for reference-guard/rename, and current in-repo boards are all <100 lines — no evidence the perf/diff cost is real here). Better lever: archive Done items out of the active board using the existing add/delete tools, documented as a convention in the jarvis-kanban.board SKILL.md — not a new tool for now."
  - id: 17
    name: "jarvis_updateKanbanItem: changes.labels is schema-typed string-only, so a valid array can never be supplied through this tool"
    status: Backlog
    priority: Low
    notes: "QM Round 2 (2026-08-26) on kanban-update-validation, deferred (not blocking, out of that CR's scope — package.json untouched there). package.json's inputSchema types every key under changes as string; labels needs an array. Either loosen the schema to accept an array for labels, or document that labels can't be updated via this tool. Pre-existing, not introduced by kanban-update-validation."
  - id: 18
    name: "TOUCH_RULES silently drops writes from any tool not on its 4-tool allowlist — no log at any level"
    status: Backlog
    priority: Medium
    notes: "SD finding while investigating item 9 (2026-08-26, CR touched-files-created-files, closed not-reproducible). The allowlist itself is fine (deliberate, per REQ_ENT_TOUCHEDFILES AC-2d — no path-sniffing fallback); the defect is that the system can't report when the list is stale for a given model/VS Code version. Recommended: log unmatched tool_names at debug, deduplicated per session, before extending the allowlist — observability first, then extend from evidence not guesses. UPDATE 2026-08-26: user observed live in syspilot's Project Manager session — a doc-creation step showed 'Generating patch ...' in the UI instead of the known create_file/replace_string_in_file/multi_replace_string_in_file flow, suggesting a distinct edit tool (possibly an apply_patch-style tool) is in use that isn't in touchTracker.ts's 4-entry allowlist. Not yet confirmed which tool_name string this corresponds to — needs the observability logging above before a specific tool_name can be added to TOUCH_RULES. Raised Low → Medium: this is no longer theoretical, there's now a live sighting of the exact gap the finding predicted."
  - id: 19
    name: "Ship the three jarvis-actor-* instruction files from jarvis-core instead of hand-copying them per workspace"
    status: Done
    priority: High
    notes: "2026-08-26. Measured drift across 5 workspaces (jarvis, syspilot, Automobil, Assistant, sonar): kernel has 4 distinct versions with the superset living only in Automobil; sonar's authoring predates the 'write the reason' section; sonar's memory carries a unique memory-first rule. Both consuming projects already gitignore these as extension-delivered, but nothing delivers them — that gap is the root cause. Shipped as CR 'actor-kernel-instructions-delivery', merged to development 2026-08-26 (6a96081). QM CLEARED twice, one Low process finding routed to CM (dispatch template wording). User reversed the prior 'private IP, not for public repo' decision: released under the project's MIT license."

