    status: Done
    priority: Medium
    labels: ["not-a-bug"]
    notes: "Found 2026-08-24 while committing docs/changes/jarvis-kanban-skill.md — git check-ignore confirmed .gitignore:31 jarvis-* swallowed it. Initially logged as a bug (unanchored WORKSPACE_PATHS entry in configPaths.ts). User clarified 2026-08-24: intentional — anything named jarvis-* anywhere is extension-delivered content, never meant to be tracked in git, at any depth. Closed as working-as-intended, no code change. Underlying trigger (a CD file named jarvis-kanban-skill.md) was itself a naming slip fixed by renaming to kanban-skill-content, consistent with the CD naming convention anyway."
