  - id: 8
    name: "Bug: error assigning Agent Modes — our undocumented-VS Code-API patch may be breaking"
    status: Done
    priority: High
    labels: ["P1", "bug"]
    notes: "Fixed via CR 'agent-mode-reset-race', QM CLEARED (Round 4 after 2 re-verify rounds), user-validated in EDH, merged to development 2026-08-24. Root causes: (1) mode-set command lacked a target-identity check before executing, so it could land on the wrong (previously-focused) session; (2) success log asserted unconditionally instead of only when the target matched; (3) unrelated delivery-loop re-entrancy guard added defensively. Round 3 caught a self-inflicted AC-7 regression (dropped error catch while syncing code to a buggy spec sample) before merge."
  - id: 9
    name: "Bug: Recently Touched Files only tracks modifications, not newly created files"
    status: Done
