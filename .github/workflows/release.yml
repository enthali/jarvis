# Implementation: SPEC_REL_RELEASEACTION, SPEC_REL_MKTPUBLISH, SPEC_REL_COREGH, SPEC_REL_CHANNEL
# Requirements: REQ_REL_RELEASEACTION, REQ_REL_VSCEPKG, REQ_REL_MKTPUBLISH, REQ_REL_CHANNEL

name: Release Extension

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # A tag ending in -pre ships on the Marketplace pre-release channel; the same
      # expression drives package, publish and the GitHub Release below.
      CHANNEL_FLAG: ${{ endsWith(github.ref_name, '-pre') && '--pre-release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci

      # ── Build core (source of truth) ────────────────────────────────────────
      - run: npm run compile
      - name: Bundle core (esbuild)
        run: node packages/core/build.js --minify

      # ── Package enthali.jarvis-core (marketplace) ────────────────────────────
      - name: Package enthali.jarvis-core
        run: cd packages/core && npx vsce package --no-dependencies $CHANNEL_FLAG

      # ── Package enthali.jarvis (legacy GitHub Release) ───────────────────────
      # core-gh is now a self-contained shim with its own src/ and build.js;
      # vsce package triggers vscode:prepublish which runs the bundle step.
      - name: Package enthali.jarvis (legacy)
        run: cd packages/core-gh && npx vsce package --no-dependencies

      # ── Package add-ons (each has own vscode:prepublish compile step) ────────
      - name: Package enthali.jarvis-pim
        run: cd packages/pim && npx vsce package --no-dependencies $CHANNEL_FLAG
      - name: Package enthali.jarvis-recorder
        run: cd packages/recorder && npx vsce package --no-dependencies $CHANNEL_FLAG
      - name: Package enthali.jarvis-mcp
        run: cd packages/mcp && npx vsce package --no-dependencies $CHANNEL_FLAG
      - name: Package enthali.jarvis-flow
        run: cd packages/flow && npx vsce package --no-dependencies $CHANNEL_FLAG
      - name: Package enthali.jarvis-kanban
        run: cd packages/kanban && npx vsce package --no-dependencies $CHANNEL_FLAG

      # ── GitHub Release — all VSIXs ───────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/core/*.vsix
            packages/core-gh/*.vsix
            packages/pim/*.vsix
            packages/recorder/*.vsix
            packages/mcp/*.vsix
            packages/flow/*.vsix
            packages/kanban/*.vsix
          generate_release_notes: true
          prerelease: ${{ endsWith(github.ref_name, '-pre') }}
          # softprops/action-gh-release is idempotent: if a release for this
          # tag already exists (e.g. manually created by the Release Engineer
          # before the tag push), it updates that release in place rather than
          # failing. No extra input is needed for this — `update_existing` is
          # not a valid input for this action (removed; was silently ignored
          # by the action but flagged as invalid by schema validation).

      # ── Marketplace publish — jarvis-core + add-ons (NOT legacy jarvis) ──────
      # Authenticates with OIDC Trusted Publishing (policy on the enthali publisher
      # bound to this repository and workflow); no stored PAT. Each step mints its own token.
      - name: Publish enthali.jarvis-core to Marketplace
        run: npx vsce publish --oidc --packagePath packages/core/jarvis-core-*.vsix --no-dependencies $CHANNEL_FLAG
      - name: Publish enthali.jarvis-pim to Marketplace
        run: npx vsce publish --oidc --packagePath packages/pim/jarvis-pim-*.vsix --no-dependencies $CHANNEL_FLAG
      - name: Publish enthali.jarvis-recorder to Marketplace
        run: npx vsce publish --oidc --packagePath packages/recorder/jarvis-recorder-*.vsix --no-dependencies $CHANNEL_FLAG
      - name: Publish enthali.jarvis-mcp to Marketplace
        run: npx vsce publish --oidc --packagePath packages/mcp/jarvis-mcp-*.vsix --no-dependencies $CHANNEL_FLAG
      - name: Publish enthali.jarvis-flow to Marketplace
        run: npx vsce publish --oidc --packagePath packages/flow/jarvis-flow-*.vsix --no-dependencies $CHANNEL_FLAG
      - name: Publish enthali.jarvis-kanban to Marketplace
        run: npx vsce publish --oidc --packagePath packages/kanban/jarvis-kanban-*.vsix --no-dependencies $CHANNEL_FLAG

