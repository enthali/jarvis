# Implementation: SPEC_REL_RELEASEACTION
# Requirements: REQ_REL_RELEASEACTION, REQ_REL_VSCEPKG

name: Release Extension

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run compile:packages
      - name: Package all member extensions
        run: |
          mkdir -p dist
          for pkg in core pim recorder mcp suite; do
            ( cd "packages/$pkg" && npx vsce package --no-dependencies )
            mv "packages/$pkg"/*.vsix dist/
          done
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*.vsix'
          generate_release_notes: true
